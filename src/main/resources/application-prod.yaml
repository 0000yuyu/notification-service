server:
  port: ${SERVICE_PORT}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/tripmate
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification_db
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAPS}
    consumer:
      group-id: ${KAFKA_GROUP_ID}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      missing-topics-fatal: false
  retry:
    interval: 1000
    max-attempts: 3
  main:
    allow-bean-definition-overriding: true
firebase:
  service-key: ${FIREBASE_SERVICE_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
      fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${random.value}:${server.port}
    hostname: ${EUREKA_INSTANCE_NAME}
    non-secure-port: ${server.port}
    non-secure-port-enabled: true
    secure-port-enabled: false
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted


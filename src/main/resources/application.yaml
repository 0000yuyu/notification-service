server:
  port: ${SERVICE_PORT}

spring:
  application:
    name: notification-service
  profiles:
    include:
      - db
      - eureka
      - firebase
      - mail
      - kafka
  main:
    allow-bean-definition-overriding: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    prometheus:
      access: unrestricted
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE